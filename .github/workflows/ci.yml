name: Fatourti CI

on:
    push:
     branches:
        - master
        - Initialization
    pull_request:

jobs:
    main:
        runs-on: ubuntu-latest

        services:
            mysql:
                image: mysql:8.0
                env:
                  MYSQL_ROOT_PASSWORD: temppass
                  MYSQL_DATABASE: fatourti
                ports:
                - 3306:3306
                options: >-
                    --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptemppass"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=10 
        steps:
            - name: Code clone
              uses: actions/checkout@v4
            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
               php-version: '8.2'
            - name: Syntax Check
              run: find . -name "*.php" -not -path "./vendor/*" -exec php -l {} \;
            - name: Database connexion
              env:
                mysql_password_root: temppass
              run: php tests/connexionTest.php
            - name: Docker Syntax Test
              env:
                mysql_root_password: temppass
                mysql_database: fatourti
                mysql_user: omarelhorre
                mysql_password: root
                smtp: test
              run: docker compose config --quiet
              
            
