name: Fatourti CI

on:
    push:
     branches:
        - master
        - Initialization
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - name: Code clone
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
               php-version: '8.2'
            - name: Syntax Check
              run: find . -name "*.php" -not -path "./vendor/*" -exec php -l {} \;
            
