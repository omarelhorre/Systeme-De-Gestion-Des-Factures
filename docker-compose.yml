name: fatourti_v2_live
services:
  db:
    image: mysql:8.0
    container_name: mysql_db_v2
    environment:
      MYSQL_ROOT_PASSWORD: ${mysql_root_password}
      MYSQL_DATABASE: ${mysql_database}
      MYSQL_USER: ${mysql_user}
      MYSQL_PASSWORD: ${mysql_password}


    ports:
      - "3308:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/init.sql
  backend:
    build: .
    container_name: php_backend_v2
    environment:
      mysql_password_root: ${mysql_root_password}
      SMTP_PASS: ${smtp}
      # Mode démo : demo=1 dans .env affiche la barre de dates (18 du mois, mois suivant, fin d'année…).
      # Sans demo=1, pas de barre et la vraie date partout.
      DEMO: ${demo:-0}
      # Paiement en ligne CMI : identifiants du marchand de test (cmi_client_id, cmi_store_key dans .env).
      # Sans eux, en mode démo, un simulateur local remplace la page de paiement de CMI.
      CMI_CLIENT_ID: ${cmi_client_id:-}
      CMI_STORE_KEY: ${cmi_store_key:-}
      CMI_PASSERELLE: ${cmi_passerelle:-}
      LD_PRELOAD: /usr/local/lib/libfaketime.so.1
      FAKETIME_TIMESTAMP_FILE: /tmp/fatourti-demo-date
      FAKETIME_NO_CACHE: "1"   # relu à chaque fois : la nouvelle date vaut dès la page suivante
      NO_FAKE_STAT: "1"        # les dates des fichiers restent vraies (sinon PHP ne voit plus les modifications du code)
    ports:
      - "8080:80"
    volumes:
        - .:/var/www/html
  scheduler:
    build: .
    command: sh -c 'while true; do php /var/www/html/bin/rappelsAnnuels.php; sleep 3600; done'
    restart: unless-stopped
    depends_on:
      - db
    environment:
      mysql_password_root: ${mysql_root_password}
      SMTP_PASS: ${smtp}
    volumes:
      - .:/var/www/html
volumes:
  mysql_data:
