name: fatourti_v2_live
services:
  db:
    image: mysql:8.0
    container_name: mysql_db_v2
    environment:
      MYSQL_ROOT_PASSWORD: ${mysql_root_password}
      MYSQL_DATABASE: ${mysql_database}
      MYSQL_USER: ${mysql_user}
      MYSQL_PASSWORD: ${mysql_password}

    ports:
      - "3308:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/init.sql
  backend:
    build: .
    container_name: php_backend_v2
    environment:
      mysql_password_root: ${mysql_root_password}
      SMTP_PASS: ${smtp}
      DEMO: ${demo:-0}
      PAIEMENT: ${paiement:-stripe}
      STRIPE_SECRET_KEY: ${stripe_secret_key:-}
      STRIPE_DEVISE: ${stripe_devise:-mad}
      CMI_CLIENT_ID: ${cmi_client_id:-}
      CMI_STORE_KEY: ${cmi_store_key:-}
      CMI_PASSERELLE: ${cmi_passerelle:-}
      LD_PRELOAD: /usr/local/lib/libfaketime.so.1
      FAKETIME_TIMESTAMP_FILE: /tmp/fatourti-demo-date
      FAKETIME_NO_CACHE: "1"
      NO_FAKE_STAT: "1"
    ports:
      - "8080:80"
    volumes:
        - .:/var/www/html
  scheduler:
    build: .
    command: sh -c 'while true; do php /var/www/html/bin/rappelsAnnuels.php; sleep 3600; done'
    restart: unless-stopped
    depends_on:
      - db
    environment:
      mysql_password_root: ${mysql_root_password}
      SMTP_PASS: ${smtp}
    volumes:
      - .:/var/www/html
volumes:
  mysql_data:
